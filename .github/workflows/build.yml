on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: Build

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint

    steps:
      - uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt -l
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: API compatibility (gorelease)
        run: go run golang.org/x/exp/cmd/gorelease@latest
        continue-on-error: true

  minimum:
    runs-on: ubuntu-latest
    name: Minimum Go version
    needs: [lint]

    steps:
      - uses: actions/checkout@v7

      - name: Install the go.mod version
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

  docs:
    runs-on: ubuntu-latest
    name: Docs
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go doc
        run: |
          for pkg in . ./lexer ./evaluator; do
            go doc -all "$pkg" > /dev/null
          done

      - name: Documentation examples
        run: go test -run '^Example' ./...

  test:
    name: Tests (${{ matrix.os }} / ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    needs: [lint, minimum]

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]

    steps:
      - uses: actions/checkout@v7

      - name: Install Go ${{ matrix.go }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: go test
        run: go test ./...

      - name: go test -race
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [lint, minimum]
    steps:
      - uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      - uses: coverage-robot/action@v1.0.13
        with:
          token: ${{ secrets.COVERAGE_TOKEN }}
          files: |
            coverage.out
          tag: unit-tests
        continue-on-error: true

  publish:
    name: Publish module
    needs: [test, coverage]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Publish version to the Go module proxy
        env:
          GOPROXY: https://proxy.golang.org
        run: go list -m "github.com/ryanmab/ignored@${GITHUB_REF_NAME}"
