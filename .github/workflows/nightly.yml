on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "7 7 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

name: Nightly

jobs:
  nightly:
    runs-on: ubuntu-latest
    name: Test (latest Go)
    steps:
      - uses: actions/checkout@v7

      - name: Install the latest Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: go test
        run: go test ./...

      - uses: ryanmab/incident-io-alert@v0.1.4
        if: failure() && github.event_name == 'schedule'
        with:
          alert_source_id: ${{ secrets.ALERT_SOURCE_ID }}
          alert_source_token: ${{ secrets.ALERT_SOURCE_TOKEN }}
          title: "is-ignored repository: Nightly build failure"
          status: firing
          description: |
            The nightly build for the is-ignored repository has failed.

            This would indicate that there is an upcoming set of breaking changes to Go, or
            other dependencies, which will require an update to the is-ignored library.

  update:
    runs-on: ubuntu-latest
    name: Test (updated modules)
    steps:
      - uses: actions/checkout@v7

      - name: Install the latest Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: go get -u
        run: go get -u ./... && go mod tidy

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - uses: ryanmab/incident-io-alert@v0.1.4
        if: failure() && github.event_name == 'schedule'
        with:
          alert_source_id: ${{ secrets.ALERT_SOURCE_ID }}
          alert_source_token: ${{ secrets.ALERT_SOURCE_TOKEN }}
          title: "is-ignored repository: Nightly build failure"
          status: firing
          description: |
            The nightly build for the is-ignored repository has failed.

            This would indicate that there is an upcoming set of breaking changes to Go, or
            other dependencies, which will require an update to the is-ignored library.
